apiVersion: v1
kind: Namespace
metadata:
  name: turnup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: turnup-config
  namespace: turnup
data:
  # Replace this before applying the manifest to a real cluster.
  CORS_ORIGIN: "https://turnup.example.com"
  TRUST_PROXY: "true"
  POSTGRES_DB: "turnup_db"
  POSTGRES_USER: "turnup"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: turnup
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: turnup-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: turnup
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: turnup-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turnup-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: turnup-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: turnup-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: turnup-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: turnup
spec:
  # Game rooms currently live in process memory. Keep this at one until a
  # shared Socket.IO adapter and shared room store are introduced.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: turnup-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turnup-server
    spec:
      containers:
        - name: server
          image: ghcr.io/sufyan-farooq/turnup.io-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: turnup-config
                  key: CORS_ORIGIN
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: turnup-config
                  key: TRUST_PROXY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: turnup-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: turnup-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: turnup
spec:
  selector:
    app.kubernetes.io/name: turnup-server
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: turnup
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: turnup-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turnup-client
    spec:
      containers:
        - name: client
          image: ghcr.io/sufyan-farooq/turnup.io-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: turnup
spec:
  selector:
    app.kubernetes.io/name: turnup-client
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: turnup
  namespace: turnup
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
spec:
  ingressClassName: nginx
  rules:
    - host: turnup.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  name: http
